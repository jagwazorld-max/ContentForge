name: content_forge
description: Professional photo & video editor for content creators. CapCut-inspired app with timeline, filters, effects, and export.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Media
  video_player: ^2.9.1
  image_picker: ^1.1.2
  photo_manager: ^3.2.2          # Better gallery access
  image: ^4.2.0                 # Image processing
  path_provider: ^2.1.4
  path: ^1.9.0

  # FFmpeg (choose one based on your needs)
  # ffmpeg_kit_flutter_min_gpl: ^6.0.3   # Recommended for most features
  # For full features use ffmpeg_kit_flutter_full_gpl (larger size)

  # Utils
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  uuid: ^4.4.2
  collection: ^1.18.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/filters/
    - assets/stickers/
    - assets/fonts/
    - assets/music/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
